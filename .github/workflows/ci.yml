name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and typecheck
        run: npm run build

      - name: Test
        run: npm test

      # Fails the build on any known vulnerability of moderate severity or
      # above, so a vulnerable dependency can't land unnoticed.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
